services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skoobpet
      POSTGRES_USER: skoobpet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skoobpet_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: postgresql://skoobpet:${POSTGRES_PASSWORD:-skoobpet_local}@postgres:5432/skoobpet
      OPER_USER: ${OPER_USER}
      OPER_PASS: ${OPER_PASS}
      FIN_USER: ${FIN_USER}
      FIN_PASS: ${FIN_PASS}
      GCP_CLIENT_EMAIL: ${GCP_CLIENT_EMAIL}
      GCP_PRIVATE_KEY: ${GCP_PRIVATE_KEY}
      SHEET_TAB: ${SHEET_TAB:-Folha1}
      SHEET_ID_CAMPINAS: ${SHEET_ID_CAMPINAS:-${SHEET_ID}}
      SHEET_ID_PIRACICABA: ${SHEET_ID_PIRACICABA}
      SHEET_ID_INDAIATUBA: ${SHEET_ID_INDAIATUBA}
      SHEET_NAME_CAMPINAS: ${SHEET_NAME_CAMPINAS:-Planilha SkoobPet (Campinas)}
      SHEET_NAME_PIRACICABA: ${SHEET_NAME_PIRACICABA:-Planilha SkoobPet (Piracicaba)}
      SHEET_NAME_INDAIATUBA: ${SHEET_NAME_INDAIATUBA:-Planilha SkoobPet (Indaiatuba)}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
